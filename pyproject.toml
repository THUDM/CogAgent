[tool.poetry]
name = "cogagent"
version = "0.1.0"
description = "CogAgent: A Visual Language Model for GUI Agents"
authors = ["CogAgent Team"]
readme = "README.md"
packages = [{include = "app"}, {include = "inference"}, {include = "finetune"}]

[tool.poetry.dependencies]
python = "^3.10"
transformers = ">=4.47.0"
torch = ">=2.5.1"
torchvision = ">=0.20.0"
huggingface-hub = ">=0.25.1"
sentencepiece = ">=0.2.0"
jinja2 = ">=3.1.4"
pydantic = ">=2.9.2"
timm = ">=1.0.9"
tiktoken = ">=0.8.0"
numpy = "1.26.4"
accelerate = ">=1.1.1"
sentence-transformers = ">=3.1.1"
gradio = ">=5.23.2"
openai = ">=1.70.0"
einops = ">=0.8.0"
pillow = ">=10.4.0"
sse-starlette = ">=2.1.3"
bitsandbytes = ">=0.43.2"
spaces = ">=0.31.1"
pyautogui = ">=0.9.54"
pyperclip = ">=1.9.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.group.finetune]
optional = true

[tool.poetry.group.finetune.dependencies]
nltk = ">=3.9.1"
jieba = ">=0.42.1"
"ruamel.yaml" = ">=0.18.10"
datasets = "*"
peft = ">0.15.1"
rouge-chinese = ">=1.0.3"

[tool.poetry.group.vllm]
optional = true

[tool.poetry.group.vllm.dependencies]
vllm = ">=0.6.6"

[tool.poetry.scripts]
test = "pytest"
tests = "pytest"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=app",
    "--cov=inference",
    "--cov=finetune",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
    "-v",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
]
console_output_style = "progress"
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["app", "inference", "finetune"]
branch = true
parallel = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/dist/*",
    "*/build/*",
    "*.egg-info/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "def __str__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]
precision = 2
show_missing = true
skip_covered = false
skip_empty = true
sort = "Cover"

[tool.coverage.html]
directory = "htmlcov"
title = "CogAgent Coverage Report"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"